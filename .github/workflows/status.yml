name: Update job status

# GitHub fires these webhook events when you change a tracker card.
on:
  issues:
    types: [labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: job-radar-card-${{ github.event.issue.number }}  # one update per card at a time
  cancel-in-progress: false

jobs:
  update:
    # Only cards made by Job Radar (they carry the "job" label)
    if: github.event.sender.login == github.repository_owner && (contains(github.event.issue.labels.*.name, 'job'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest saved data, not the commit that started this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply the change
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m jobradar.status
      - name: Save results
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3; do
            git add -A data/jobs.json README.md data/health data/mcp
            git diff --cached --quiet && exit 0
            git commit -q -m "Status update for #${{ github.event.issue.number }}"
            git push -q && exit 0
            # Another update saved first: merge both versions so nothing is lost.
            cp data/jobs.json "$RUNNER_TEMP/ours.json"
            cp -r data/health "$RUNNER_TEMP/" 2>/dev/null || true
            git fetch -q origin "$branch" && git reset -q --hard "origin/$branch"
            cp -r "$RUNNER_TEMP/health" data/ 2>/dev/null || true
            python -m jobradar.merge "$RUNNER_TEMP/ours.json"
            python -m jobradar.lastmile --refresh || true
            python -m jobradar.health --write > /dev/null || true
          done
          exit 1
      - name: If anything above failed, alert and keep the health log
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 jobradar/failsafe.py || true
          [ -d data/health ] || exit 0
          git config user.name "job-radar[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch=$(git rev-parse --abbrev-ref HEAD)
          cp -r data/health "$RUNNER_TEMP/" 2>/dev/null || true
          for attempt in 1 2 3; do
            git fetch -q origin "$branch" && git reset -q --hard "origin/$branch" || exit 0
            cp -r "$RUNNER_TEMP/health" data/ 2>/dev/null || true
            git add -A data/health
            git diff --cached --quiet && exit 0
            git commit -q -m "Health log: failed run" && git push -q && exit 0
          done
