name: Score a job you added

# Fires when you submit the "Add a job" form.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: job-radar-card-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  score:
    # The title check is a backup: GitHub drops a form's label if the label doesn't exist yet.
    if: github.event.sender.login == github.repository_owner && (contains(github.event.issue.labels.*.name, 'add-job') || github.event.issue.title == 'New job')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest saved data, not the commit that started this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Score it and build the application kit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m jobradar.addjob
      - name: Save results
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3; do
            git add -A data/jobs.json README.md resumes data/health data/mcp
            git diff --cached --quiet && exit 0
            git commit -q -m "Added job from #${{ github.event.issue.number }}"
            git push -q && exit 0
            cp data/jobs.json "$RUNNER_TEMP/ours.json"; cp -r resumes "$RUNNER_TEMP/" 2>/dev/null || true
            cp -r data/health "$RUNNER_TEMP/" 2>/dev/null || true
            git fetch -q origin "$branch" && git reset -q --hard "origin/$branch"
            cp -r "$RUNNER_TEMP/health" data/ 2>/dev/null || true
            cp -r "$RUNNER_TEMP/resumes" . 2>/dev/null || true
            python -m jobradar.merge "$RUNNER_TEMP/ours.json"
            python -m jobradar.lastmile --refresh || true
            python -m jobradar.health --write > /dev/null || true
          done
          exit 1
      - name: If anything above failed, alert and keep the health log
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 jobradar/failsafe.py || true
          [ -d data/health ] || exit 0
          git config user.name "job-radar[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch=$(git rev-parse --abbrev-ref HEAD)
          cp -r data/health "$RUNNER_TEMP/" 2>/dev/null || true
          for attempt in 1 2 3; do
            git fetch -q origin "$branch" && git reset -q --hard "origin/$branch" || exit 0
            cp -r "$RUNNER_TEMP/health" data/ 2>/dev/null || true
            git add -A data/health
            git diff --cached --quiet && exit 0
            git commit -q -m "Health log: failed run" && git push -q && exit 0
          done
