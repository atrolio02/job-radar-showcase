name: Daily job scan

on:
  # Turn on the daily scan by removing the # from the lines below.
  # schedule:
  #   - cron: "37 11 * * 1-5"   # weekdays around 5:37 a.m. Austin time (11:37 UTC)
  #   - cron: "17 13 * * 1-5"   # weekdays around 7:17 a.m. Austin time (13:17 UTC)
  workflow_dispatch:           # adds a "Run workflow" button for running it any time

permissions:
  contents: write   # save data/jobs.json and the README dashboard
  issues: write     # open tracker cards

concurrency:
  group: job-radar-scan  # never run two scans at once
  cancel-in-progress: false

# Signs the dashboard's one-tap Move links (the same key as the MCP server; never shown).
env:
  MOVE_LINK_SECRET: ${{ secrets.MCP_SECRET }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest saved data, not the commit that started this run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find, score and alert
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m jobradar.scan
      - name: Save results
        run: |
          git config user.name "job-radar[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch=$(git rev-parse --abbrev-ref HEAD)
          for attempt in 1 2 3 4 5 6 7 8; do
            git add -A data/jobs.json README.md resumes data/health data/mcp
            git diff --cached --quiet && exit 0
            git commit -q -m "Daily scan $(date -u +%F)"
            git push -q && exit 0
            # Another update saved first: merge both versions so nothing is lost.
            cp data/jobs.json "$RUNNER_TEMP/ours.json"; cp -r resumes "$RUNNER_TEMP/" 2>/dev/null || true
            cp -r data/health "$RUNNER_TEMP/" 2>/dev/null || true
            sleep $((RANDOM % 5 + 1)); git fetch -q origin "$branch" && git reset -q --hard "origin/$branch"
            cp -r "$RUNNER_TEMP/health" data/ 2>/dev/null || true
            cp -r "$RUNNER_TEMP/resumes" . 2>/dev/null || true
            python -m jobradar.merge "$RUNNER_TEMP/ours.json"
            python -m jobradar.lastmile --refresh || true
            python -m jobradar.health --write > /dev/null || true
          done
          exit 1
      - name: If anything above failed, alert and keep the health log
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 jobradar/failsafe.py || true
          [ -d data/health ] || exit 0
          git config user.name "job-radar[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch=$(git rev-parse --abbrev-ref HEAD)
          cp -r data/health "$RUNNER_TEMP/" 2>/dev/null || true
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$branch" && git reset -q --hard "origin/$branch" || exit 0
            cp -r "$RUNNER_TEMP/health" data/ 2>/dev/null || true
            git add -A data/health
            git diff --cached --quiet && exit 0
            git commit -q -m "Health log: failed run" && git push -q && exit 0
          done
