name: Add a job
description: Found a job on LinkedIn, Indeed or anywhere else? Paste it here to score it and get an application kit.
title: "New job"
labels: ["add-job"]
body:
  - type: input
    id: link
    attributes: {label: Link to the job}
    validations: {required: true}
  - type: input
    id: company
    attributes: {label: Company}
    validations: {required: true}
  - type: input
    id: title
    attributes: {label: Job title}
    validations: {required: true}
  - type: input
    id: location
    attributes: {label: Location}
  - type: dropdown
    id: workplace
    attributes:
      label: Work arrangement
      options: ["Remote", "Hybrid", "On-site", "Not sure"]
  - type: input
    id: pay
    attributes: {label: Pay range (if posted)}
  - type: textarea
    id: description
    attributes:
      label: Job description
      description: Copy the whole posting and paste it here.
    validations: {required: true}
